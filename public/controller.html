<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UNI.VERRE — Manette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { height: 100%; }
    body {
      min-height: 100%;
      font-family: 'Rubik', system-ui, sans-serif;
      color: #f7e8c3;
      background: linear-gradient(160deg, #4a2f1c, #241209) fixed;
      display: flex; flex-direction: column;
      padding: 14px; gap: 12px;
      user-select: none; -webkit-user-select: none;
      overflow-y: auto; overflow-x: hidden;
    }
    h1 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 3px; color: #e8c877; text-align: center; }
    .hidden { display: none !important; }
    button {
      font-family: 'Rubik', sans-serif; font-weight: 800; color: #241209;
      background: linear-gradient(160deg, #f2d68a, #d8a94f);
      border: none; border-radius: 16px; padding: 16px;
      font-size: 18px; cursor: pointer;
      box-shadow: 0 4px 0 #8a6a2f;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a6a2f; }
    button:disabled { opacity: .4; }
    button.ghost { background: rgba(255,255,255,.12); color: #f7e8c3; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
    button.danger { background: linear-gradient(160deg, #ff8a5c, #e0502c); color: #fff; box-shadow: 0 4px 0 #7a2810; }
    input[type=text] {
      font-size: 18px; padding: 14px; border-radius: 14px; border: 2px solid #e8c877;
      background: rgba(0,0,0,.3); color: #f7e8c3; width: 100%;
    }

    /* ——— Inscription ——— */
    #joinView { display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; flex: 1; }
    #joinView h1 { font-size: 60px; }
    #photoBtn {
      width: 140px; height: 140px; border-radius: 50%;
      border: 4px dashed #e8c877; background: rgba(255,255,255,.08);
      color: #f7e8c3; font-size: 15px; font-weight: 600;
      display: flex; align-items: center; justify-content: center; text-align: center;
      overflow: hidden; padding: 0; box-shadow: none;
    }
    #photoBtn img { width: 100%; height: 100%; object-fit: cover; }
    #joinBtn { width: 100%; font-size: 22px; }
    #joinErr { color: #ff9d7a; font-size: 14px; text-align: center; }

    /* ——— En jeu ——— */
    #gameView { display: none; flex-direction: column; gap: 10px; flex: 1; min-height: 0; }
    #meCard {
      display: flex; align-items: center; gap: 12px;
      background: rgba(0,0,0,.35); border-radius: 16px; padding: 8px 12px;
    }
    #meCard img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 3px solid #e8c877; }
    #meName { font-weight: 800; font-size: 17px; }
    #meStats { display: flex; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    #meStats span { background: rgba(255,255,255,.1); border-radius: 8px; padding: 2px 8px; font-size: 13px; font-weight: 600; }
    #meTotal { font-size: 11px; opacity: .6; margin-top: 2px; }

    /* main de cartes */
    #hand { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .cardBtn {
      flex: 0 0 auto; width: 92px; min-height: 96px;
      background: linear-gradient(160deg, #cdb2ff, #9a72e8); color: #2c1548;
      border-radius: 12px; padding: 8px 6px; font-size: 11px; font-weight: 800;
      box-shadow: 0 4px 0 #4a2a8a; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .cardBtn .ci { font-size: 26px; }
    .cardBtn .cs { font-size: 9.5px; font-weight: 600; opacity: .8; line-height: 1.2; }
    .cardBtn .ctag { font-size: 9px; font-weight: 800; background: rgba(0,0,0,.18); border-radius: 6px; padding: 1px 5px; }
    .cardBtn.isnew { outline: 3px solid #fff3d6; }
    #handHead { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; opacity: .75; margin-bottom: -4px; }
    #helpBtn { width: 44px; height: 44px; padding: 0; font-size: 20px; border-radius: 12px; flex: none; }
    #effects { display: flex; flex-direction: column; gap: 6px; }
    #effects:empty { display: none; }
    .fx { font-size: 13.5px; line-height: 1.35; padding: 7px 10px; border-radius: 10px; background: rgba(255,255,255,.08); border-left: 4px solid #e8c877; }
    .fx.bad { border-left-color: #ff8a5c; }
    .fx.cold { border-left-color: #4fc3f7; }
    .preview { background: rgba(232,200,119,.14); border: 1px solid rgba(232,200,119,.5); border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.4; text-align: center; }
    .preview.warn { background: rgba(255,138,92,.15); border-color: #ff8a5c; }
    .why { text-align: center; font-size: 14.5px; font-weight: 600; color: #ffbe9a; }
    .tags { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .tags span { font-size: 12px; font-weight: 700; background: rgba(205,178,255,.2); border: 1px solid #cdb2ff; border-radius: 8px; padding: 2px 8px; }
    .hint { text-align: center; font-size: 13px; opacity: .75; line-height: 1.4; }
    #drinkFlash {
      position: fixed; left: 12px; right: 12px; top: 12px; z-index: 25;
      background: linear-gradient(160deg, #ff9d5c, #e0502c); color: #fff; border-radius: 16px;
      padding: 14px 16px; font-size: 19px; font-weight: 800; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.5); transition: opacity .3s, transform .3s;
    }
    #drinkFlash.off { opacity: 0; transform: translateY(-20px); pointer-events: none; }
    #drinkFlash small { display: block; font-size: 13px; font-weight: 600; opacity: .9; }
    #turnFlash { text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; color: #ffe9a8; }
    .help h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1.5px; font-size: 22px; color: #e8c877; margin-top: 6px; }
    .help p { font-size: 14px; line-height: 1.45; }
    .hrow { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.4; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
    .hrow .hi { font-size: 22px; width: 30px; text-align: center; flex: none; }
    .hrow b { display: block; font-size: 13px; letter-spacing: .3px; }
    .cellPick { display: flex; flex-direction: column; gap: 1px; align-items: center; }
    .cellPick small { font-size: 9px; font-weight: 600; opacity: .75; line-height: 1.1; white-space: normal; }
    .cardBtn.win { background: linear-gradient(160deg, #ffe9a8, #e8c877); box-shadow: 0 4px 0 #8a6a2f; animation: pulse .6s infinite; }
    .cardBtn.inactive { opacity: .45; }

    #actionZone { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: center; min-height: 0; overflow: auto; }
    #actionLabel { text-align: center; font-size: 18px; font-weight: 600; line-height: 1.4; }

    #rollBtn { font-size: 42px; padding: 32px; border-radius: 28px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 50% { transform: scale(1.04); } }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .pickBtn {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: rgba(255,255,255,.1); color: #f7e8c3;
      box-shadow: 0 4px 0 rgba(0,0,0,.4); font-size: 13px;
      padding: 9px 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .pickBtn img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; }
    .pickBtn.sel { outline: 3px solid #e8c877; background: rgba(232, 200, 119, .25); }

    .distRow { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.08); border-radius: 14px; padding: 8px 12px; }
    .distRow img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; }
    .distRow { padding: 6px 10px; }
    .distRow .dn { flex: 1; font-weight: 600; }
    .distRow button { width: 44px; height: 44px; font-size: 24px; padding: 0; border-radius: 12px; }
    .distRow .dv { width: 28px; text-align: center; font-size: 21px; font-weight: 800; }
    #distLeft { text-align: center; font-size: 16px; font-weight: 600; }

    #waitBox { text-align: center; opacity: .85; font-size: 17px; line-height: 1.5; }
    #waitBox .big { font-size: 40px; }

    .panel {
      border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
      max-height: 44vh; overflow-y: auto; flex-shrink: 0;
    }
    #motPanel { background: rgba(130, 90, 200, .25); border: 1px solid #b48aff; }
    #defPanel { background: rgba(255, 150, 60, .16); border: 2px solid #ff9d5c; animation: pulse 1s infinite; }
    #corbeauPanel { background: rgba(200, 120, 200, .16); border: 2px solid #d98ad9; }
    #freezePanel { background: rgba(79, 195, 247, .18); border: 2px solid #4fc3f7; }
    #collectPanel { background: rgba(232, 160, 60, .18); border: 2px solid #e8a83c; }
    #votePanel { background: rgba(232, 160, 60, .18); border: 2px solid #e8a83c; }
    .panel .vq { text-align: center; font-size: 15.5px; font-weight: 600; line-height: 1.4; }
    .panel .vbtns { display: flex; gap: 10px; }
    .panel .vbtns button { flex: 1; font-size: 16px; }
    .panel .tally { text-align: center; font-size: 13.5px; opacity: .85; }
    .stars { display: flex; gap: 6px; justify-content: center; }
    .stars button { flex: 1; font-size: 18px; padding: 12px 0; }

    /* table du lobby */
    #seatWrap { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    #seatTitle { font-size: 16px; font-weight: 600; text-align: center; }
    #seatSvg { width: 100%; max-width: 360px; }
    .seat { cursor: pointer; }
    .seat circle.spot { fill: rgba(255,255,255,.10); stroke: rgba(232,200,119,.6); stroke-width: 2; stroke-dasharray: 4 4; }
    .seat.free:active circle.spot { fill: rgba(232,200,119,.35); }
    .seat.mine circle.spot { fill: rgba(232,200,119,.30); stroke: #e8c877; stroke-dasharray: none; stroke-width: 3; }
    .seat.taken circle.spot { stroke-dasharray: none; }

    #hostZone { display: flex; flex-direction: column; gap: 10px; }

    #cardSheet {
      position: fixed; inset: 0; z-index: 20;
      background: rgba(10, 5, 2, .8); backdrop-filter: blur(3px);
      display: flex; flex-direction: column; justify-content: flex-end;
    }
    #cardSheetInner {
      background: linear-gradient(160deg, #3a2413, #241209);
      border-top: 3px solid #e8c877; border-radius: 22px 22px 0 0;
      padding: 20px 16px 26px; display: flex; flex-direction: column; gap: 12px;
      max-height: 80vh; overflow: auto;
    }
    #cardSheetTitle { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: #cdb2ff; text-align: center; }
    #cardSheetText { text-align: center; font-size: 15px; line-height: 1.4; }
    #cellGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    #cellGrid button { padding: 7px 3px; font-size: 15px; }

    #toast {
      position: fixed; left: 12px; right: 12px; bottom: 14px;
      background: #201008f0; border: 1px solid #e8c877; border-radius: 14px;
      padding: 12px 16px; font-size: 15px; text-align: center;
      transition: opacity .3s; opacity: 0; pointer-events: none; z-index: 30;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="joinView">
    <h1>UNI.VERRE</h1>
    <button id="photoBtn">📸<br/>Prends-toi<br/>en photo</button>
    <input type="file" id="photoInput" accept="image/*" capture="user" class="hidden" />
    <input type="text" id="nameInput" placeholder="Ton pseudo" maxlength="16" />
    <button id="joinBtn">REJOINDRE 🍻</button>
    <div id="joinErr"></div>
  </div>

  <div id="gameView">
    <div id="meCard">
      <img id="meAvatar" alt="" />
      <div style="flex:1">
        <div id="meName"></div>
        <div id="meStats"></div>
        <div id="meTotal"></div>
      </div>
      <button id="helpBtn" class="ghost" onclick="showHelp()" aria-label="Règles">📖</button>
    </div>
    <div id="effects"></div>
    <div id="handHead" class="hidden"><span>🃏 Tes cartes — tape pour voir / jouer</span></div>
    <div id="hand"></div>
    <div id="defPanel" class="panel hidden"></div>
    <div id="corbeauPanel" class="panel hidden"></div>
    <div id="freezePanel" class="panel hidden"></div>
    <div id="motPanel" class="panel hidden"></div>
    <div id="collectPanel" class="panel hidden"></div>
    <div id="votePanel" class="panel hidden"></div>
    <div id="actionZone"></div>
    <div id="hostZone"></div>
  </div>

  <div id="cardSheet" class="hidden"></div>
  <div id="toast"></div>
  <div id="drinkFlash" class="off"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = id => document.getElementById(id);
    let avatar = null;
    let you = null;
    let joined = false;

    // ——— Photo → avatar 256px ———
    $('photoBtn').addEventListener('click', () => $('photoInput').click());
    $('photoInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const S = 256;
        const c = document.createElement('canvas');
        c.width = S; c.height = S;
        const ctx = c.getContext('2d');
        const side = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S, S);
        avatar = c.toDataURL('image/jpeg', 0.82);
        $('photoBtn').innerHTML = '<img src="' + avatar + '"/>';
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(file);
    });

    function join() {
      const name = $('nameInput').value.trim();
      if (!name) { $('joinErr').textContent = 'Il te faut un pseudo !'; return; }
      localStorage.setItem('uniName', name);
      if (avatar) localStorage.setItem('uniAvatar', avatar);
      socket.emit('join', { name, avatar });
    }
    $('joinBtn').addEventListener('click', join);
    $('nameInput').value = localStorage.getItem('uniName') || '';
    const savedAvatar = localStorage.getItem('uniAvatar');
    if (savedAvatar) { avatar = savedAvatar; $('photoBtn').innerHTML = '<img src="' + avatar + '"/>'; }

    socket.on('joined', () => {
      joined = true;
      $('joinView').style.display = 'none';
      $('gameView').style.display = 'flex';
    });
    socket.on('join-refused', msg => { $('joinErr').textContent = msg; });
    socket.on('connect', () => {
      if (joined) socket.emit('join', { name: localStorage.getItem('uniName'), avatar });
    });

    // ——— Toasts ———
    let toastTimer = null;
    socket.on('event', ev => {
      $('toast').textContent = (ev.icon || '') + ' ' + ev.text;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3200);
      if (ev.kind === 'drink' && you && ev.playerId === you.me.id && navigator.vibrate) navigator.vibrate([120, 60, 120]);
    });

    socket.on('notice', n => toast((n.icon || '') + ' ' + n.text, 5000));
    function toast(text, ms = 3200) {
      $('toast').textContent = text;
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $('toast').classList.remove('show'), ms);
    }

    function esc(s) { return String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c])); }
    function pById(id) { return you.players.find(p => p.id === id); }
    function av(p) {
      if (p.avatar) return p.avatar;
      const s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="' + (p.color || '#888') + '"/><text x="50" y="68" font-size="52" font-family="sans-serif" font-weight="bold" fill="#fff" text-anchor="middle">' + esc((p.name || '?')[0].toUpperCase()) + '</text></svg>';
      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(s)));
    }

    // ——— Rendu principal ———
    socket.on('you', (data) => {
      you = data;
      renderMe();
      renderEffects();
      renderAlerts();
      renderDefense();
      renderHand();
      renderCorbeau();
      renderFreeze();
      renderMot();
      renderCollect();
      renderVote();
      renderAction();
      renderHost();
    });

    function renderMe() {
      const me = you.me;
      $('meAvatar').src = av(me);
      $('meName').textContent = me.name + (you.isHost ? ' 👑' : '');
      $('meStats').innerHTML =
        '<span>🍺 ' + me.gorgees + '</span>' +
        '<span>🥃 ' + me.shots + '</span>' +
        (me.finis ? '<span>🍻 ' + me.finis + '</span>' : '') +
        (me.frozen ? '<span>❄️ gelé·e</span>' : '');
      $('meTotal').textContent = 'Total soirée : ' + me.totalGorgees + ' gorgées · ' + me.totalShots + ' shots';
    }

    // ——— Textes d'aide : ce que fait chaque case (selon son intensité) ———
    function shotWord() { return you && you.noShots ? '5 gorgées' : '1 shot'; }
    const CELL_HELP = {
      depart: () => 'Case de départ.',
      arrivee: () => 'Arrivée ! Tu sors de la course. Le dernier encore en course boit l\'UNI.VERRE.',
      boit: c => 'Tu bois ' + c.n + ' gorgées.',
      distribue: c => 'Tu répartis ' + c.n + ' gorgées entre les autres, sur ton téléphone.',
      shot: () => 'Tu bois ' + shotWord() + '.',
      'fini-verre': () => 'Tu finis ton verre.',
      'fini-droite': () => 'Ton voisin de DROITE à table finit son verre.',
      'fini-gauche': () => 'Ton voisin de GAUCHE à table finit son verre.',
      'tous-boivent': c => 'Tout le monde boit ' + c.n + ' gorgées, toi compris.',
      'uni-plus': c => 'Tu verses ' + c.n + ' doses dans l\'UNI.VERRE (le dernier le boira).',
      'uni-gorgees': c => 'Tu bois ' + c.n + ' gorgées prises dans l\'UNI.VERRE. S\'il en contient moins de ' + c.n + ', tu y verses ' + c.n + ' doses à la place.',
      saute: () => 'Ton pion saute en avant jusqu\'à la case indiquée, et tu appliques son effet.',
      retourne: () => 'Ton pion recule jusqu\'à la case indiquée, et tu appliques son effet.',
      gel: () => 'Tu passes ton prochain tour.',
      'gel-suivant': () => 'Le prochain joueur en course passe son tour.',
      roulette: c => 'Tourne 6 fois sur toi-même, puis bois ' + c.n + ' gorgées.',
      'mot-interdit': () => 'Tu choisis un mot. Jusqu\'à ton prochain tour, celui qui le dit boit ' + shotWord() + ' : on le balance sur son téléphone, la table vote.',
      meduse: () => 'Tout le monde baisse la tête, puis la relève au signal en regardant quelqu\'un. Chacun déclare qui il a regardé : deux regards croisés = ' + shotWord() + ' chacun.',
      'bras-de-fer': () => 'Tu choisis un adversaire. La table vote pour le gagnant : le perdant boit ' + shotWord() + '. Table partagée = 2 gorgées chacun.',
      freeze: c => 'Freeze armé jusqu\'à ton prochain tour. Quand tu veux, fige-toi et appuie ⚡ : tout le monde doit se figer, la table désigne le dernier, il boit ' + c.n + ' gorgées.',
      imite: () => 'Imite quelqu\'un de la pièce. Les autres te notent de 0 à 5 ⭐ : tu bois 5 moins la note moyenne.',
      'invente-regle': () => 'Tu inventes une règle, valable jusqu\'à ton prochain tour (affichée sur la TV).',
      question: () => 'Réponds à voix haute, ou refuse et bois 3 gorgées.',
      ficha: () => 'Montre-le à la table, ou refuse et bois 3 gorgées.',
      'change-recipient': () => 'Verse ton verre dans autre chose (bol, tasse…) et continue avec.',
      'echange-verre': () => 'Tu échanges ton verre avec le joueur de ton choix.',
      valise: c => '« Dans ma valise il y a… » : chacun répète la liste et ajoute un objet. La table désigne le premier qui se trompe : il boit ' + c.n + ' gorgées.',
      carte: () => 'Tu pioches une carte : elle arrive en secret sur ton téléphone.',
      compliments: () => 'Fais un compliment sincère à chaque joueur. Si la majorité dit « pas sincère » : 3 gorgées.',
      duel: () => 'Tu choisis un adversaire, chacun lance un dé : le plus petit boit la différence. Égalité = 2 gorgées chacun.',
      'bois-pour-tous': () => 'Jusqu\'à ton prochain tour, tout ce que les autres devraient boire, c\'est toi qui le bois.',
    };
    function cellLabel(c) { return you && you.noShots ? c.label.replace(/1 SHOT/g, '5 GORGÉES') : c.label; }
    function cellHelp(c) { return (CELL_HELP[c.type] || (() => ''))(c); }

    let CARD_CATALOG = [];
    fetch('/cards').then(r => r.json()).then(x => { CARD_CATALOG = x; }).catch(() => {});

    // ——— Règles consultables à tout moment ———
    window.showHelp = () => {
      const board = (you && you.board) || [];
      const seen = new Set(); const rows = [];
      board.forEach(c => {
        if (c.type === 'depart' || seen.has(c.type)) return;
        seen.add(c.type);
        rows.push('<div class="hrow"><span class="hi">' + c.icon + '</span><div><b>' + esc(cellLabel(c)) + '</b>' + esc(cellHelp(c)) + '</div></div>');
      });
      const cards = CARD_CATALOG.map(c => '<div class="hrow"><span class="hi">' + c.icon + '</span><div><b>' + esc(c.title) +
        (c.anonymous ? ' 🕶' : '') + (c.kind === 'window' ? ' 🛡️' : '') + '</b>' + esc(cardText(c)) + '</div></div>').join('');
      $('cardSheet').innerHTML = '<div id="cardSheetInner" class="help"><div id="cardSheetTitle">📖 RÈGLES</div>' +
        '<h3>🎯 Le but</h3><p>Arriver avant les autres. La partie continue jusqu\'à ce qu\'il ne reste qu\'un joueur en course : <b>le dernier boit l\'UNI.VERRE</b> (tout ce qui a été versé dedans).</p>' +
        '<h3>🎲 Ton tour</h3><p>Lance le dé sur ton téléphone. Ton pion avance et l\'effet de la case s\'applique. Quand il faut choisir, voter ou répondre, ça apparaît ici.</p>' +
        (you && you.noShots ? '<p>🚫🥃 <b>Mode sans shots</b> : chaque shot vaut 5 gorgées.</p>' : '') +
        '<h3>🃏 Les cartes</h3><p>2 cartes au départ, +1 à chaque case Pioche. Tu les joues quand tu veux, même hors de ton tour (sauf pendant un vote ou une décision de la table). ' +
        '🕶 = <b>anonyme</b> : la TV ne dit pas qui l\'a jouée. 🛡️ = <b>défense</b> : se propose toute seule quand tu reçois à boire, et vaut pour la dernière chose que tu as reçue.</p>' +
        cards +
        '<h3>🟫 Les cases de ce plateau</h3>' + rows.join('') +
        '<button class="ghost" onclick="closeSheet()">FERMER</button></div>';
      $('cardSheet').classList.remove('hidden');
    };

    // ——— Effets en cours qui te concernent ———
    function renderEffects() {
      const me = you.me, fx = [];
      if (you.phase !== 'playing') { $('effects').innerHTML = ''; return; }
      if (me.frozen) fx.push(['cold', '❄️ Tu es gelé·e : tu passes ton prochain tour.']);
      if (me.ancre) fx.push(['bad', '⚓ Ton prochain dé sera divisé par deux.']);
      if (me.boitPourTous) fx.push(['bad', '🐫 Tu bois à la place de tout le monde jusqu\'à ton prochain tour.']);
      for (const id of you.myChains || []) {
        const o = pById(id);
        fx.push(['bad', '⛓️ Menotté·e avec ' + esc(o ? o.name : '?') + ' : quand l\'un boit, l\'autre boit autant.']);
      }
      const camel = you.players.find(p => p.boitPourTous && p.id !== me.id);
      if (camel) fx.push(['', '🐫 ' + esc(camel.name) + ' boit à ta place jusqu\'à son prochain tour.']);
      for (const r of you.rules || []) fx.push(['', '📜 Règle de ' + esc(r.by) + ' : « ' + esc(r.text) + ' »']);
      $('effects').innerHTML = fx.map(([k, t]) => '<div class="fx ' + k + '">' + t + '</div>').join('');
    }

    // ——— Alertes perso : « tu bois », « c'est ton tour » ———
    let lastDrinkSeen = null, flashTimer = null, wasMyTurn = false;
    function drinkWhat(ld) {
      return [ld.g ? ld.g + ' gorgée' + (ld.g > 1 ? 's' : '') : '', ld.s ? ld.s + ' shot' + (ld.s > 1 ? 's' : '') : '', ld.fini ? 'ton verre en entier' : '']
        .filter(Boolean).join(' + ');
    }
    function renderAlerts() {
      const ld = you.myLastDrink;
      if (ld && ld.ts !== lastDrinkSeen) {
        const first = lastDrinkSeen === null && Date.now() - ld.ts > 8000; // pas d'alerte au rechargement
        lastDrinkSeen = ld.ts;
        if (!first) {
          const f = $('drinkFlash');
          f.innerHTML = '🍺 Tu bois ' + esc(drinkWhat(ld)) + ' !' + (ld.source ? '<small>' + esc(ld.source) + '</small>' : '');
          f.classList.remove('off');
          clearTimeout(flashTimer);
          flashTimer = setTimeout(() => f.classList.add('off'), 4500);
        }
      }
      const mine = !!(you.myPending && you.myPending.type === 'roll');
      if (mine && !wasMyTurn && navigator.vibrate) navigator.vibrate([200, 80, 200]);
      wasMyTurn = mine;
    }

    // ——— Main de cartes ———
    // tap = fiche de la carte : ce qu'elle fait, ce qu'elle va faire MAINTENANT,
    // et pourquoi elle n'est pas jouable si c'est le cas
    let knownHand = null, handPhase = null, newCards = new Set();
    function cardText(c) { return you && you.noShots ? c.text.replace(/1 shot/g, '5 gorgées') : c.text; }
    function cardState(c) {
      if (you.phase !== 'playing') return { usable: false, why: 'La partie n\'a pas commencé.' };
      if (you.collect) return { usable: false, why: 'Attends que la table ait fini de décider.' };
      if (you.vote) return { usable: false, why: 'Attends la fin du vote.' };
      if (c.kind === 'window' && !you.shieldWindow) return { usable: false, why: 'Se joue quand tu reçois à boire : elle te sera proposée à ce moment-là.' };
      if (c.id === 'rejoue' && !(you.myPending && you.myPending.type === 'roll')) return { usable: false, why: 'Se joue seulement à ton tour, avant de lancer le dé.' };
      if ((c.id === 'turbo' || c.id === 'putsch') && you.me.finished) return { usable: false, why: 'Tu es déjà à l\'arrivée : ton pion ne bouge plus.' };
      if (c.id === 'corbeau' && you.myCorbeau) return { usable: false, why: 'Envoie d\'abord ton corbeau en attente.' };
      if (c.id === 'putsch' && !you.players.some(p => p.id !== you.me.id && !p.finished)) return { usable: false, why: 'Personne d\'autre en course.' };
      return { usable: true };
    }
    function cardPreview(c) {
      const N = you.board.length, me = you.me, P = you.players;
      const cell = i => 'case ' + (i + 1) + ' « ' + cellLabel(you.board[i]) + ' »';
      switch (c.id) {
        case 'tous2': return { t: 'Les ' + P.length + ' joueurs boivent 2 gorgées, <b>toi compris</b>.' };
        case 'uni4': return { t: 'L\'UNI.VERRE passe de ' + you.uniVerre + ' à <b>' + (you.uniVerre + 4) + '</b> doses.' };
        case 'turbo': {
          const to = Math.min(N - 2, me.pos + 3);
          return { t: 'Ton pion : case ' + (me.pos + 1) + ' → <b>' + cell(to) + '</b>.<br/>L\'effet de cette case ne s\'applique pas.' + (to < me.pos + 3 ? '<br/>(Bloqué juste avant l\'arrivée.)' : '') };
        }
        case 'premier3': {
          const t = [...P].sort((a, b) => b.pos - a.pos)[0];
          return { t: '<b>' + esc(t.name) + '</b> (case ' + (t.pos + 1) + (t.finished ? ', arrivé·e' : '') + ') boira 3 gorgées.', warn: t.id === me.id && 'C\'est toi qui es en tête !' };
        }
        case 'dernier3': {
          const t = [...P].sort((a, b) => a.pos - b.pos)[0];
          return { t: '<b>' + esc(t.name) + '</b> (case ' + (t.pos + 1) + ') boira 3 gorgées.', warn: t.id === me.id && 'C\'est toi le dernier !' };
        }
        case 'putsch': {
          const o = P.filter(p => p.id !== me.id && !p.finished);
          return { t: 'Tu es case ' + (me.pos + 1) + '. Tu échanges ta place avec un joueur tiré au sort parmi : ' + o.map(p => esc(p.name) + ' (case ' + (p.pos + 1) + ')').join(', ') + '.<br/>Pas d\'effet de case.' };
        }
        case 'bouclier': case 'miroir': {
          const ld = you.myLastDrink;
          if (!ld) return null;
          return { t: (c.id === 'bouclier' ? 'Annule' : 'Renvoie') + ' : <b>' + esc(drinkWhat(ld)) + '</b>' + (ld.source ? ' (' + esc(ld.source) + ')' : '') + '.<br/>Ça ne vaut que pour la dernière chose que tu as reçue.' };
        }
        case 'bombe': return { t: 'Le 💣 sera visible sur la TV, mais personne ne saura que c\'est toi. Elle explose sur le premier qui s\'y arrête : ' + shotWord() + '.' };
        case 'menottes': return { t: 'Valable 1 tour de table. Tu peux te menotter toi-même.' };
        case 'ancre': return { t: 'Le joueur verra ⚓ à côté de son nom jusqu\'à son prochain lancer.' };
        case 'vol': return { t: 'La TV dit à qui une carte a été volée, pas par qui. Tu découvres la carte volée en privé.' };
        case 'corbeau': return { t: 'Personne ne saura que c\'est toi. Le message reste affiché 1 tour de table.' };
        case 'rejoue': return { t: 'Après ce tour, tu rejoues tout de suite un tour complet.' };
      }
      return null;
    }

    function renderHand() {
      const cards = you.hand || [];
      const ids = cards.map(c => c.id);
      if (knownHand && you.phase === 'playing' && handPhase === 'playing') {
        const pool = [...knownHand];
        for (const id of ids) { const k = pool.indexOf(id); if (k >= 0) pool.splice(k, 1); else newCards.add(id); }
      }
      knownHand = ids; handPhase = you.phase;
      for (const id of [...newCards]) if (!ids.includes(id)) newCards.delete(id);
      $('handHead').classList.toggle('hidden', !cards.length);
      $('hand').innerHTML = cards.map((c, i) => {
        const st = cardState(c);
        const glow = c.kind === 'window' && st.usable && !$('defPanel').classList.contains('hidden');
        const tag = c.kind === 'window' ? '<span class="ctag">🛡️ défense</span>' : c.anonymous ? '<span class="ctag">🕶 anonyme</span>' : '';
        return '<button class="cardBtn ' + (glow ? 'win' : '') + (st.usable ? '' : ' inactive') + (newCards.has(c.id) ? ' isnew' : '') + '" onclick="openCard(' + i + ')">' +
          '<span class="ci">' + c.icon + '</span>' + esc(c.title) + tag + '</button>';
      }).join('');
    }

    window.showCardInfo = (i) => window.openCard(i);

    window.openCard = (i) => {
      const c = (you.hand || [])[i];
      if (!c) return;
      newCards.delete(c.id);
      const sheet = $('cardSheet');
      const st = cardState(c);
      const pv = cardPreview(c);
      const tags = '<div class="tags">' + (c.anonymous ? '<span>🕶 Anonyme</span>' : '') + (c.kind === 'window' ? '<span>🛡️ Défense</span>' : '') + '</div>';
      const head = '<div id="cardSheetTitle">' + c.icon + ' ' + esc(c.title) + '</div>' + tags +
        '<div id="cardSheetText">' + esc(cardText(c)) + '</div>' +
        (pv ? '<div class="preview">' + pv.t + '</div>' : '') +
        (pv && pv.warn ? '<div class="preview warn">⚠️ ' + pv.warn + '</div>' : '');
      let body = '';
      const close = '<button class="ghost" onclick="closeSheet()">' + (st.usable ? 'ANNULER' : 'FERMER') + '</button>';
      if (!st.usable) {
        body = '<div class="why">⏳ ' + st.why + '</div>' + close;
      } else if (!c.needs) {
        body = '<button onclick="playCard(\'' + c.id + '\', {})">JOUER ' + c.icon + '</button>' + close;
      } else if (c.needs === 'player') {
        let opts = you.players.filter(p => p.id !== you.me.id);
        if (c.id === 'ancre') opts = opts.filter(p => !p.finished && !p.ancre);
        const lbl = { ancre: 'Sur qui jeter l\'ancre ?', vol: 'À qui voler une carte ?', miroir: 'Sur qui renvoyer ?' }[c.id] || 'Choisis un joueur';
        body = '<div class="vq">' + lbl + '</div><div class="grid">' + opts.map(p =>
          '<button class="pickBtn" onclick="playCard(\'' + c.id + '\', {target:' + p.id + '})"><img src="' + av(p) + '"/>' + esc(p.name) +
          (c.id === 'vol' ? ' · 🃏' + p.handCount : '') + '</button>').join('') + '</div>' +
          (opts.length ? '' : '<div class="why">Personne à viser pour l\'instant.</div>') + close;
      } else if (c.needs === 'pair') {
        window._pair = [];
        const opts = you.players;
        body = '<div class="vq">Choisis DEUX joueurs à menotter</div><div class="grid" id="pairGrid">' + opts.map(p =>
          '<button class="pickBtn" data-id="' + p.id + '" onclick="togglePair(this)"><img src="' + av(p) + '"/>' + esc(p.name) + (p.id === you.me.id ? ' (toi)' : '') + '</button>').join('') + '</div>' +
          '<button id="pairGo" disabled onclick="playCard(\'' + c.id + '\', {a:window._pair[0], b:window._pair[1]})">MENOTTER ⛓️</button>' + close;
      } else if (c.needs === 'cell') {
        const N = you.board.length;
        const occupied = new Set(you.players.map(p => p.pos));
        const trapped = new Set(you.traps || []);
        const cells = [];
        for (let k = 1; k <= N - 2; k++) if (!occupied.has(k) && !trapped.has(k)) cells.push(k);
        body = '<div class="vq">Choisis la case à piéger (numéros du plateau TV, cases vides seulement)</div><div id="cellGrid">' + cells.map(k =>
          '<button class="ghost cellPick" onclick="playCard(\'' + c.id + '\', {cell:' + k + '})">' + (k + 1) + '<small>' + esc(you.board[k].icon + ' ' + cellLabel(you.board[k])) + '</small></button>').join('') + '</div>' + close;
      } else if (c.needs === 'message') {
        body = '<div class="vq">Écris ton message anonyme. Tu l\'enverras à l\'écran quand tu voudras.</div>' +
          '<input type="text" id="corbeauIn" maxlength="90" autocomplete="off" placeholder="Ton message…"/>' +
          '<button onclick="sendCorbeauCard(\'' + c.id + '\')">GARDER LE CORBEAU 💌</button>' + close;
      } else if (c.needs === 'alloc') {
        window._dist = {}; window._distMax = 5;
        const opts = you.players.filter(p => p.id !== you.me.id);
        body = '<div id="distLeft">Reste à donner : <b id="leftN">5</b></div>' +
          opts.map(p =>
            '<div class="distRow"><img src="' + av(p) + '"/><div class="dn">' + esc(p.name) + '</div>' +
            '<button class="ghost" onclick="distAdj(' + p.id + ', -1)">−</button>' +
            '<div class="dv" id="dv-' + p.id + '">0</div>' +
            '<button onclick="distAdj(' + p.id + ', 1)">+</button></div>').join('') +
          '<button id="distGo" disabled onclick="playCard(\'' + c.id + '\', {alloc: window._dist})">DISTRIBUER 🫗</button>' + close;
      }
      sheet.innerHTML = '<div id="cardSheetInner">' + head + body + '</div>';
      sheet.classList.remove('hidden');
      renderHand();
    };
    window.closeSheet = () => $('cardSheet').classList.add('hidden');
    window.sendCorbeauCard = (id) => {
      const text = $('corbeauIn').value.trim();
      if (!text) return;
      playCard(id, { text });
    };
    window.playCard = (id, payload) => {
      socket.emit('use-card', { id, payload });
      closeSheet();
    };
    window.togglePair = (btn) => {
      const id = parseInt(btn.dataset.id, 10);
      const i = window._pair.indexOf(id);
      if (i >= 0) { window._pair.splice(i, 1); btn.classList.remove('sel'); }
      else if (window._pair.length < 2) { window._pair.push(id); btn.classList.add('sel'); }
      const go = $('pairGo');
      if (go) go.disabled = window._pair.length !== 2;
    };
    window.distAdj = (id, d) => {
      const cur = window._dist[id] || 0;
      const total = Object.values(window._dist).reduce((a, b) => a + b, 0);
      if (d > 0 && total >= window._distMax) return;
      const next = Math.max(0, cur + d);
      window._dist[id] = next;
      $('dv-' + id).textContent = next;
      const newTotal = Object.values(window._dist).reduce((a, b) => a + b, 0);
      $('leftN').textContent = window._distMax - newTotal;
      const go = $('distGo');
      if (go) go.disabled = newTotal !== window._distMax;
    };

    // ——— Défense : proposée pile au moment où tu reçois à boire ———
    let defDismissed = 0; // ts du dernier "je bois" assumé
    function renderDefense() {
      const panel = $('defPanel');
      const ld = you.myLastDrink;
      const hasShield = (you.hand || []).some(c => c.id === 'bouclier');
      const hasMirror = (you.hand || []).some(c => c.id === 'miroir');
      if (!ld || (!hasShield && !hasMirror) || ld.ts === defDismissed || you.phase !== 'playing') {
        panel.classList.add('hidden'); return;
      }
      panel.classList.remove('hidden');
      const what = drinkWhat(ld);
      panel.innerHTML = '<div class="vq">🍺 Tu viens de recevoir <b>' + esc(what) + '</b>' +
        (ld.source ? ' <span style="opacity:.7">(' + esc(ld.source) + ')</span>' : '') + ' !</div>' +
        '<div class="vbtns">' +
        (hasShield ? '<button onclick="defShield(' + ld.ts + ')">🛡️ J\'ANNULE</button>' : '') +
        (hasMirror ? '<button onclick="defMirror()">🪞 JE RENVOIE</button>' : '') +
        '</div>' +
        '<button class="ghost" onclick="defDrink(' + ld.ts + ')">Je bois 💪 (je garde ma carte)</button>' +
        '<div class="hint">' + (hasShield ? '🛡️ Bouclier : tu ne bois rien. ' : '') + (hasMirror ? '🪞 Miroir : un autre boit à ta place. ' : '') + 'Tu peux encore changer d\'avis tant que tu ne reçois rien d\'autre.</div>';
    }
    window.defShield = (ts) => { defDismissed = 0; socket.emit('use-card', { id: 'bouclier', payload: {} }); };
    window.defDrink = (ts) => { defDismissed = ts; renderDefense(); };
    window.defMirror = () => {
      const panel = $('defPanel');
      const opts = you.players.filter(p => p.id !== you.me.id);
      panel.innerHTML = '<div class="vq">🪞 Sur qui renvoies-tu ' + esc(drinkWhat(you.myLastDrink || {})) + ' ?</div>' +
        '<div class="grid3">' + opts.map(p =>
          '<button class="pickBtn" onclick="socket.emit(\'use-card\', {id:\'miroir\', payload:{target:' + p.id + '}})"><img src="' + av(p) + '"/>' + esc(p.name) + '</button>'
        ).join('') + '</div>' +
        '<button class="ghost" onclick="renderDefense()">Retour</button>';
    };
    window.renderDefense = renderDefense;

    // ——— Corbeau écrit, prêt à partir quand tu veux ———
    function renderCorbeau() {
      const panel = $('corbeauPanel');
      if (!you.myCorbeau || you.phase !== 'playing') { panel.classList.add('hidden'); return; }
      panel.classList.remove('hidden');
      panel.innerHTML = '<div class="vq">💌 Ton corbeau est prêt :<br/>« ' + esc(you.myCorbeau) + ' »</div>' +
        '<button onclick="socket.emit(\'send-corbeau\')">ENVOYER À L\'ÉCRAN 🕶</button>';
    }

    // ——— Freeze (le poseur peut déclencher à tout moment) ———
    function renderFreeze() {
      const panel = $('freezePanel');
      if (!you.freezeMine || you.phase !== 'playing') { panel.classList.add('hidden'); return; }
      panel.classList.remove('hidden');
      panel.innerHTML = '<div class="vq">🥶 FREEZE armé jusqu\'à ton prochain tour.<br/>Quand tu veux : <b>fige-toi en silence</b>, attends que les autres le remarquent et se figent, puis appuie. La table désignera le dernier à s\'être figé (' + you.freeze.n + ' gorgées).</div>' +
        '<button class="danger" onclick="socket.emit(\'freeze-now\')">⚡ J\'AI FREEZÉ !</button>';
    }

    // ——— Mot interdit : tout le monde peut balancer ———
    function renderMot() {
      const panel = $('motPanel');
      const mi = you.motInterdit;
      if (!mi || you.phase !== 'playing' || you.collect) { panel.classList.add('hidden'); return; }
      panel.classList.remove('hidden');
      const opts = you.players.filter(p => p.id !== you.me.id);
      panel.innerHTML = '<div class="vq">🤫 Mot interdit : « <b>' + esc(mi.word) + '</b> »<br/>Quelqu\'un l\'a dit ? Balance-le : la table votera, coupable = ' + shotWord() + '.</div>' +
        '<div class="grid3">' + opts.map(p =>
          '<button class="pickBtn" onclick="socket.emit(\'mot-report\', ' + p.id + ')"><img src="' + av(p) + '"/>💥 ' + esc(p.name) + '</button>'
        ).join('') + '</div>';
    }

    // ——— Décisions collectives ———
    function renderCollect() {
      const panel = $('collectPanel');
      const c = you.myCollect;
      const cc = you.collect;
      if (!cc) { panel.classList.add('hidden'); return; }
      panel.classList.remove('hidden');
      if (!c) {
        const waiting = (cc.waitingIds || []).map(id => { const p = pById(id); return p ? p.name : '?'; }).join(', ');
        panel.innerHTML = '<div class="vq">🗳️ ' + esc(cc.prompt || 'Décision en cours…') + '</div>' +
          '<div class="tally">Réponses : ' + cc.answered + '/' + cc.total + (waiting ? ' — on attend ' + esc(waiting) : '') + '</div>';
        return;
      }
      let body = '';
      const meta = c.meta || {};
      const EXPLAIN = {
        meduse: 'Déclare honnêtement qui tu regardais en levant les yeux. Si cette personne t\'a désigné·e aussi : ' + shotWord() + ' chacun.',
        accusation: 'Majorité de OUI = ' + shotWord() + ' pour l\'accusé·e. Égalité = acquitté·e.',
        compliments: 'OUI = sincère. Si les NON l\'emportent, il/elle boit 3 gorgées.',
        bdf: 'Le perdant boit ' + shotWord() + '. Si la table est partagée : 2 gorgées chacun.',
        freeze: 'Le plus désigné boit. Ex æquo : ils boivent tous.',
        valise: 'Le plus désigné boit. Ex æquo : ils boivent tous.',
        imite: '5⭐ = parfait, il/elle ne boit rien. 0⭐ = 5 gorgées. Il/elle boit 5 moins la moyenne.',
        pret: 'Quand tout le monde est prêt, la TV lance le compte à rebours : baissez la tête, relevez-la au signal en regardant quelqu\'un.',
      };
      switch (c.purpose) {
        case 'meduse': {
          const opts = you.players.filter(p => p.id !== you.me.id);
          body = '<button class="ghost" onclick="answer(null)">🙈 ZÉRO eye contact</button>' +
            '<div class="vq" style="opacity:.8">…ou qui as-tu regardé ?</div>' +
            '<div class="grid3">' + opts.map(p =>
              '<button class="pickBtn" onclick="answer(' + p.id + ')"><img src="' + av(p) + '"/>👀 ' + esc(p.name) + '</button>').join('') + '</div>';
          break;
        }
        case 'accusation': case 'compliments':
          body = '<div class="vbtns"><button onclick="answer(\'oui\')">OUI ✔</button>' +
            '<button class="ghost" onclick="answer(\'non\')">NON ✘</button></div>';
          break;
        case 'bdf': {
          const a = pById(meta.aId), b = pById(meta.bId);
          body = '<div class="vbtns">' +
            '<button class="pickBtn" onclick="answer(' + meta.aId + ')"><img src="' + (a ? av(a) : '') + '"/>' + (a ? esc(a.name) : '?') + '</button>' +
            '<button class="pickBtn" onclick="answer(' + meta.bId + ')"><img src="' + (b ? av(b) : '') + '"/>' + (b ? esc(b.name) : '?') + '</button></div>';
          break;
        }
        case 'freeze': case 'valise': {
          const opts = you.players;
          body = '<div class="grid3">' + opts.map(p =>
            '<button class="pickBtn" onclick="answer(' + p.id + ')"><img src="' + av(p) + '"/>' + esc(p.name) + (p.id === you.me.id ? ' (moi)' : '') + '</button>').join('') + '</div>' +
            '<button class="ghost" onclick="answer(null)">Personne 😇</button>';
          break;
        }
        case 'imite':
          body = '<div class="stars">' + [0, 1, 2, 3, 4, 5].map(n =>
            '<button class="ghost" onclick="answer(' + n + ')">' + n + '⭐<br/><small style="font-size:10px;opacity:.75">' + (5 - n) + ' 🍺</small></button>').join('') + '</div>';
          break;
        case 'pret':
          body = '<button style="font-size:26px;padding:26px" onclick="answer(\'ok\')">✅ JE SUIS PRÊT·E</button>';
          break;
      }
      panel.innerHTML = '<div class="vq">🗳️ ' + esc(c.prompt) + '</div>' +
        (EXPLAIN[c.purpose] ? '<div class="hint">' + EXPLAIN[c.purpose] + '</div>' : '') + body;
    }
    window.answer = (v) => socket.emit('collect-answer', v);

    // ——— Vote tèj ———
    function renderVote() {
      const panel = $('votePanel');
      const v = you.vote;
      if (!v) { panel.classList.add('hidden'); return; }
      panel.classList.remove('hidden');
      const target = pById(v.targetId);
      const tname = target ? esc(target.name) : '?';
      const why = v.reason === 'offline' ? 'est déconnecté·e' : 'ne joue pas';
      const tally = '<div class="tally">🚪 Tèj : ' + v.tej + ' · 🕰 Attend : ' + v.wait + ' (' + (v.tej + v.wait) + '/' + v.total + ' votes)</div>';
      if (v.targetId === you.me.id) {
        panel.innerHTML = '<div class="vq">🗳️ Les autres votent sur ton sort… joue vite !</div>' + tally;
        return;
      }
      if (!you.isVoter) { panel.innerHTML = '<div class="vq">🗳️ Vote en cours sur ' + tname + '…</div>' + tally; return; }
      if (you.myVote) {
        panel.innerHTML = '<div class="vq">🗳️ Tu as voté « ' + (you.myVote === 'tej' ? '🚪 On le tèj' : '🕰 On attend') + ' »</div>' + tally;
        return;
      }
      panel.innerHTML = '<div class="vq">🗳️ ' + tname + ' ' + why + ' — on fait quoi ?</div>' +
        '<div class="vbtns">' +
        '<button class="ghost" onclick="socket.emit(\'vote\', \'wait\')">🕰 ON ATTEND</button>' +
        '<button class="danger" onclick="socket.emit(\'vote\', \'tej\')">🚪 ON LE TÈJ</button>' +
        '</div>' + tally;
    }

    // ——— Zone d'action (tour de jeu / lobby) ———
    function renderAction() {
      const zone = $('actionZone');
      const pend = you.myPending;
      if (you.phase === 'lobby') { renderSeats(zone); return; }
      if (you.phase === 'over') {
        zone.innerHTML = '<div id="waitBox"><div class="big">🏁</div>Partie terminée ! Regarde le podium sur l\'écran.</div>' +
          '<button onclick="socket.emit(\'replay\')">🔄 REJOUER (nouveau plateau)</button>';
        return;
      }
      if (you.collect) { zone.innerHTML = ''; return; }
      if (you.me.finished) {
        zone.innerHTML = '<div id="waitBox"><div class="big">🏁</div>Tu es arrivé·e ! La course continue pour les autres…<br/>Tu peux encore <b>voter</b> et <b>jouer tes cartes</b> 😈</div>';
        return;
      }
      if (!pend) {
        const turnP = pById(you.turn);
        const here = you.board[you.me.pos];
        zone.innerHTML = '<div id="waitBox"><div class="big">🍹</div>Au tour de <b>' + (turnP ? esc(turnP.name) : '…') + '</b>' +
          '<div class="hint" style="margin-top:8px">Ton pion : case ' + (you.me.pos + 1) + (here ? ' — ' + esc(cellLabel(here)) : '') + '</div></div>';
        return;
      }
      switch (pend.type) {
        case 'roll':
          zone.innerHTML = '<div id="turnFlash">🔔 C\'EST TON TOUR !</div>' +
            (you.me.ancre ? '<div class="preview warn">⚓ Ancre : ce lancer sera divisé par deux.</div>' : '') +
            '<button id="rollBtn" onclick="socket.emit(\'roll\')">🎲 LANCE LE DÉ</button>' +
            ((you.hand || []).some(c => c.id === 'rejoue') ? '<div class="hint">🔁 Tu as REJOUE : c\'est maintenant ou jamais pour ce tour.</div>' : '');
          break;
        case 'ok':
          zone.innerHTML = '<div id="actionLabel">' + esc(pend.label || 'À toi de jouer !') + '</div>' +
            (pend.purpose === 'refusable'
              ? '<div class="vbtns" style="display:flex;gap:10px"><button style="flex:1" onclick="socket.emit(\'ok\', \'done\')">C\'EST FAIT ✔</button>' +
                '<button class="danger" style="flex:1" onclick="socket.emit(\'ok\', \'refuse\')">JE BOIS 3 🍺</button></div>'
              : '<button onclick="socket.emit(\'ok\')">C\'EST FAIT ✔</button>');
          break;
        case 'text':
          zone.innerHTML = '<div id="actionLabel">' + esc(pend.label) + '</div>' +
            '<input type="text" id="textIn" maxlength="80" autocomplete="off"/>' +
            '<button onclick="sendText()">VALIDER ✔</button>';
          break;
        case 'pick': {
          const opts = (pend.options || []).map(id => pById(id)).filter(Boolean);
          zone.innerHTML = '<div id="actionLabel">' + esc(pend.label || 'Choisis un joueur') + '</div>' +
            '<div class="grid">' + opts.map(p =>
              '<button class="pickBtn" onclick="socket.emit(\'pick\', ' + p.id + ')"><img src="' + av(p) + '"/>' + esc(p.name) + '</button>'
            ).join('') + '</div>' +
            (pend.allowNone ? '<button class="ghost" onclick="socket.emit(\'pick\', null)">Personne 😇</button>' : '');
          break;
        }
        case 'distribute': {
          const opts = you.players.filter(p => p.id !== you.me.id);
          window._dist = {}; window._distMax = pend.n;
          zone.innerHTML = '<div id="actionLabel">🫗 Distribue ' + pend.n + ' gorgées aux autres</div><div class="hint">Tape + à côté des joueurs, puis envoie quand il ne reste plus rien.</div>' +
            '<div id="distLeft">Reste : <b id="leftN">' + pend.n + '</b></div>' +
            opts.map(p =>
              '<div class="distRow"><img src="' + av(p) + '"/><div class="dn">' + esc(p.name) + '</div>' +
              '<button class="ghost" onclick="distAdjPending(' + p.id + ', -1)">−</button>' +
              '<div class="dv" id="dv-' + p.id + '">0</div>' +
              '<button onclick="distAdjPending(' + p.id + ', 1)">+</button></div>'
            ).join('') +
            '<button id="distGo" disabled onclick="socket.emit(\'distribute\', window._dist)">ENVOYER 🍺</button>';
          break;
        }
      }
    }
    window.distAdjPending = (id, d) => window.distAdj(id, d);
    window.sendText = () => {
      const v = $('textIn').value.trim();
      if (v) socket.emit('text-submit', v);
    };

    // ——— Table du lobby : choisis ta place en tapant dessus ———
    function renderSeats(zone) {
      const S = you.seats || 12;
      const W = 360, H = 260, cx = W / 2, cy = H / 2, rx = 128, ry = 86;
      const seatEls = [];
      for (let i = 0; i < S; i++) {
        const a = (i / S) * Math.PI * 2 - Math.PI / 2;
        const x = cx + Math.cos(a) * rx;
        const y = cy + Math.sin(a) * ry;
        const p = you.players.find(pl => pl.seat === i);
        const mine = p && p.id === you.me.id;
        const cls = mine ? 'mine' : p ? 'taken' : 'free';
        let inner = '<circle class="spot" cx="' + x + '" cy="' + y + '" r="22"/>';
        if (p) {
          inner += '<clipPath id="sc' + i + '"><circle cx="' + x + '" cy="' + y + '" r="19"/></clipPath>' +
            '<image href="' + av(p) + '" x="' + (x - 19) + '" y="' + (y - 19) + '" width="38" height="38" clip-path="url(#sc' + i + ')" preserveAspectRatio="xMidYMid slice"/>' +
            '<circle cx="' + x + '" cy="' + y + '" r="21" fill="none" stroke="' + p.color + '" stroke-width="3"/>' +
            '<text x="' + x + '" y="' + (y + 34) + '" font-size="10" fill="#f7e8c3" text-anchor="middle" font-weight="600">' + esc(p.name.slice(0, 8)) + '</text>';
        }
        seatEls.push('<g class="seat ' + cls + '" onclick="pickSeat(' + i + ', ' + (p && !mine ? 'true' : 'false') + ')">' + inner + '</g>');
      }
      const seated = you.me.seat !== null && you.me.seat !== undefined;
      const mode = you.noShots ? '<div style="text-align:center;font-size:13px;color:#ff9d7a;font-weight:600">🚫🥃 Mode sans shots : chaque shot vaudra 5 gorgées</div>' : '';
      zone.innerHTML = '<div id="seatWrap">' + mode +
        '<div id="seatTitle">' + (seated ? '✅ Tu es installé·e ! (tape ailleurs pour changer)' : '🪑 <b>Tape sur ta place</b> autour de la table, là où tu es assis·e') + '</div>' +
        '<svg id="seatSvg" viewBox="0 0 ' + W + ' ' + H + '">' +
        '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + (rx - 34) + '" ry="' + (ry - 26) + '" fill="#55371f" stroke="#e8c877" stroke-width="3"/>' +
        '<ellipse cx="' + cx + '" cy="' + (cy - 4) + '" rx="' + (rx - 42) + '" ry="' + (ry - 32) + '" fill="#6a4527"/>' +
        '<text x="' + cx + '" y="' + (cy + 6) + '" font-size="18" fill="#e8c877" text-anchor="middle" font-family="Bebas Neue" letter-spacing="2">UNI.VERRE</text>' +
        seatEls.join('') + '</svg></div>';
    }
    window.pickSeat = (i, taken) => {
      if (taken) return;
      socket.emit('seat', i);
      if (navigator.vibrate) navigator.vibrate(30);
    };

    function renderHost() {
      const zone = $('hostZone');
      if (!you.isHost) { zone.innerHTML = ''; return; }
      if (you.phase === 'lobby') {
        const ready = you.allSeated;
        zone.innerHTML = '<button class="ghost" onclick="socket.emit(\'toggle-shots\')">' +
          (you.noShots ? '🚫🥃 SANS SHOTS (1 shot = 5 gorgées)' : '🥃 SHOTS ACTIVÉS') + '</button>' +
          '<button class="ghost" onclick="socket.emit(\'new-board\')">🎲 NOUVEAU PLATEAU</button>' +
          '<button onclick="socket.emit(\'start\')" ' + (ready ? '' : 'disabled') + '>▶ COMMENCER' + (ready ? '' : ' (tout le monde doit s\'asseoir)') + '</button>';
      } else zone.innerHTML = '';
    }
  </script>
</body>
</html>
